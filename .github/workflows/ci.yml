name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server tests
        run: |
          pip install -r server/requirements.txt
          python -m unittest server/test_server.py -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Deprecation infos from newer Flutter releases should not fail the build.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
